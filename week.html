<!-- Weekly Class Schedule -->
<!DOCTYPE html>
<html>
<head>
    <style>
        table, th, td {
            border: 1px solid #333;
            border-collapse: collapse;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #add8e6;
        }
        td {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h2>Weekly Class Schedule</h2>
    <table>
        <tr>
            <th>Time</th>
            <th>Monday</th>
            <th>Tuesday</th>
            <th>Wednesday</th>
            <th>Thursday</th>
            <th>Friday</th>
        </tr>
        <tr>
            <td>9:00 - 10:00</td>
            <td>Math</td>
            <td>Science</td>
            <td>English</td>
            <td>History</td>
            <td>Math</td>
        </tr>
        <tr>
            <td>10:00 - 11:00</td>
            <td>English</td>
            <td>Math</td>
            <td>Science</td>
            <td>Math</td>
            <td>Geography</td>
        </tr>
        <tr>
            <td>11:00 - 12:00</td>
            <td>Break</td>
            <td>Break</td>
            <td>Break</td>
            <td>Break</td>
            <td>Break</td>
        </tr>
        <tr>
            <td>12:00 - 1:00</td>
            <td>Computer</td>
            <td>English</td>
            <td>Math</td>
            <td>Science</td>
            <td>English</td>
        </tr>
    </table>
</body>
</html>
