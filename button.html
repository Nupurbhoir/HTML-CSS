<!DOCTYPE html>
<html>
<head>
<style>
    .container {
    width: 80%; 
    margin: auto;
    border: 2px solid black;
    padding: 10px;
    }

    .box1 {
    width: 50%; 
    height: 100px;
    background-color: lightblue;
    margin-bottom: 10px;
    padding: 10px;
    }

    .box2 {
    width: 300px; 
    height: 120px;
    background-color: lightgreen;
    margin-bottom: 10px;
    padding: 10px;
    }

    .box3 {
    width: 100%; 
    height: 140px;
    background-color: lightpink;
    padding: 10px;
    }

    button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    background-color: #007BFF;
    color: white;
    border: none;
    border-radius: 5px;
    }

    button:hover {
    background-color: #0056b3;
    }

    
    ul {
    list-style-type: none;
    padding: 0;
    }

    li {
    font-size: 18px;
    padding: 5px;
    }

    
    li:first-child {
    color: red; 
    }

    li:nth-child(2) {
    color: blue; 
    }

    li:last-child {
    color: green; 
    }
</style>
</head>
<body>

<div class="container">
    <div class="box1">
    Box 1
    <br>
    <button>Click Me</button>
    </div>
    <div class="box2">
    Box 2
    <br>
    <button>Click Me</button>
    </div>
    <div class="box3">
    Box 3
    <br>
    <button>Click Me</button>
    </div>

    <!-- Unordered List -->
    <ul>
    <li>First item</li>
    <li>Second item</li>
    <li>Third item</li>
    </ul>
</div>

</body>
</html>
