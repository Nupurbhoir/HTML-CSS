<!-- Product Table with Total -->
<!DOCTYPE html>
<html>
<head>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #bf88fa;
        }
        tfoot {
            background-color: rgb(237, 158, 185);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Product Table</h2>
    <table>
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
        </tr>
        <tr>
            <td>Notebook</td>
            <td>50</td>
            <td>3</td>
            <td>150</td>
        </tr>
        <tr>
            <td>Pen</td>
            <td>10</td>
            <td>5</td>
            <td>50</td>
        </tr>
        <tr>
            <td>Bag</td>
            <td>500</td>
            <td>1</td>
            <td>500</td>
        </tr>
        <tr>
            <td>Water Bottle</td>
            <td>150</td>
            <td>2</td>
            <td>300</td>
        </tr>
        <tr>
            <td>Highlighter</td>
            <td>25</td>
            <td>4</td>
            <td>100</td>
        </tr>
        <tfoot>
            <tr>
                <td colspan="3">Total Sum</td>
                <td>1100</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
