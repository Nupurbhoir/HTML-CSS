<!DOCTYPE html>
<html>
<head>
  <title>Font Manual</title>
  <style>
    .colored-text {
      color: darkblue;
    }
  </style>
</head>
<body>

  <p style="font-family: Georgia, serif;">Font family: Georgia</p>
  <p style="font-family: 'Helvetica', 'Arial', sans-serif;">Font family: Helvetica, Arial, sans-serif</p>
  <p style="font-style: italic;">Font style: italic</p>
  <p>
    <span style="font-weight: bold;">Bold text</span> | 
    <span style="font-weight: normal;">Normal text</span>
  </p>
  <p style="font-size: 16px;">Font size: 16px</p>
  <p style="font-size: 1.5em;">Font size: 1.5em</p>
  <p style="font-size: 1.2rem;">Font size: 1.2rem</p>
  <p style="font-size: 120%;">Font size: 120%</p>
  <p class="colored-text">Styled with external CSS (color)</p>

</body>
</html>
