<!DOCTYPE html>
<html>
<head>
  <style>
    .container {
      width: 80%; 
      margin: auto;
      border: 2px solid black;
      padding: 10px;
    }

    .box1 {
      width: 50%;
      height: 100px;
      background-color: lightblue;
      margin-bottom: 10px;
    }

    .box2 {
      width: 300px; 
      height: 120px;
      background-color: rgb(168, 233, 168);
      margin-bottom: 10px;
    }

    .box3 {
      width: 100%; 
      height: 140px;
      background-color: rgb(255, 179, 191);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="box1">Box 1 - 50% width of container</div>
    <div class="box2">Box 2 - 300px width</div>
    <div class="box3">Box 3 - 100% width of container</div>
  </div>
 <button> 
  background-color: pink

 </button>
</body>
</html>
